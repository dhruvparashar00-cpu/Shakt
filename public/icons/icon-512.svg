<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366F1" stroke-opacity="0.3" stroke-width="4" />

  <!-- Outer Energy Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Shakt Emblem: Stylized Trident/Quill Energy Core -->
  <g filter="url(#glow)">
    <!-- Central Lightning/Quill -->
    <path d="M256 90 L280 210 L330 220 L275 270 L290 390 L256 340 L222 390 L237 270 L182 220 L232 210 Z" fill="url(#spark)" />
    <!-- Center core jewel -->
    <circle cx="256" cy="256" r="24" fill="#FFFFFF" />
  </g>

  <!-- Devanagari Accent 'श' subtle contour or note lines -->
  <path d="M160 410 Q 256 440 352 410" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M190 435 Q 256 460 322 435" stroke="#818CF8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
